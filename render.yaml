# Deploy na Render (https://render.com) — "Blueprint".
# Render > New > Blueprint > escolha o repositório do GitHub com este projeto.
# Os valores marcados com sync: false são pedidos na hora (nunca ficam no Git).
services:
  - type: web
    name: padaria-encomendas
    runtime: node
    # free = gratuito para testar: "dorme" após 15 min sem uso e leva ~1 min para acordar.
    # Com lojas de verdade, troque para starter (sempre ligado) no painel da Render:
    # serviço > Settings > Instance Type. O link não muda.
    plan: free
    region: virginia
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run start:cloud
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_ENV
        value: sandbox
      - key: ASAAS_WEBHOOK_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
