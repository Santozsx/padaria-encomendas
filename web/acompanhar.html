<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acompanhar pedido</title>
  <meta name="theme-color" content="#0E6E63">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/cliente.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/" data-store-link>
        <span class="brand-mark" data-icon="bread"></span>
        <span class="brand-text"><strong id="store-name">Padaria</strong><small>Acompanhar pedido</small></span>
      </a>
      <a class="btn ghost pill" href="/" data-store-link><span data-icon="plus"></span><span class="hide-sm">Fazer encomenda</span></a>
    </div>
  </header>
  <main class="wrap">
    <section class="card track">
      <h1>Acompanhe seu pedido</h1>
      <form id="track-form" class="track-form">
        <label class="field">Nº do pedido<input name="code" inputmode="numeric" required pattern="\d+" placeholder="Ex.: 1024"></label>
        <label class="field">WhatsApp usado no pedido<input name="phone" type="tel" required placeholder="(11) 99999-8888"></label>
        <button class="btn primary" type="submit">Consultar</button>
      </form>
      <p class="field-error" id="track-error" role="alert"></p>
      <div id="track-result" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="/js/acompanhar.js"></script>
</body>
</html>
